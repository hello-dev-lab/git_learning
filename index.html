<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <form id="loginForm">
      <h2>Login</h2>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="Enter password" required>
          <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>
      </div>

      <button type="submit">Login</button>
      <p class="message" id="message"></p>
    </form>
  </div>

  <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Consectetur suscipit accusamus harum quos doloremque laboriosam officia aliquid quo animi esse cumque accusantium, provident odit repudiandae voluptate ea magni saepe. Nihil.</p>

  <script src="script.js"></script>
</body>
</html>
